name: SMARDDA CI

on:
  push:
    branches:
      - rework-submodule-structure

jobs:
  serial-build-and-test:
    runs-on: ubuntu-latest

    env:
      DEBIAN_FRONTEND: noninteractive
      SMALIB_DIR: ${{ github.workspace }}/smalib
      SMITER_DIR: ${{ github.workspace}}

    steps:
      - name: Checkout pfc and submodules
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gfortran \
            doxygen \
            gnuplot \
            graphviz \
            libhdf5-dev \
            make \
            python3 \
            python3-pip \
            texlive-font-utils \
            xz-utils 
          sudo strip --remove-section=.note.ABI-tag /usr/lib/x86_64-linux-gnu/libQt5Core.so.5
          python3 -m pip install numpy

      - name: Show submodules
        run: git submodule status

      - name: Check regression references
        run: |
          find smiteraux1/References -type f | sort
          find smiteraux2/References -type f | sort