image:
  name: ubuntu:22.04

stages:
  - build
  - test
  - pages

.build-setup:
  stage: build
  variables:
    DEBIAN_FRONTEND: noninteractive
    GIT_SUBMODULE_STRATEGY: recursive
  before_script:
    - apt-get -y update
    - apt-get -y install
        gfortran
        doxygen
        gnuplot
        graphviz
        libhdf5-dev
        make
        python3
        python3-pip
        texlive-font-utils
        xz-utils
      # Discard symbol in libQt5Core that causes gnuplot to crash.
      # The issue is apparently to do with Qt5 making a system call that's not
      # available in some older kernel versions.
      # See https://askubuntu.com/questions/1034313/ubuntu-18-4-libqt5core-so-5-cannot-open-shared-object-file-no-such-file-or-dir
    - strip --remove-section=.note.ABI-tag /usr/lib/x86_64-linux-gnu/libQt5Core.so.5
    - export SMALIB_DIR="$(pwd)/smardda-lib"
    - export SMITER_DIR="$(pwd)"
    - export SMALIB="$(pwd)/smardda-lib"
    - export PATH="${SMITER_DIR}/exec:${SMALIB_DIR}/exec:${PATH}"
    # Dependencies for tests
    - python3 -m pip install numpy # numpy for fast array comparisons with tolerance
  tags:
    - lower-privacy
    - ubuntu

build-and-test-pfc:
  extends: .build-setup
  script:
    - bash smardda-lib/exec/build gfortran
    - bash exec/build gfortran
    # Test
    - cd ./smiteraux # must be in smiteraux directory to run test deck
    - bash ./tests.bash
    - cd ..
    - tar -xf smiter-aux-results/smiteraux.tar.xz -C smiter-aux-results
    - bash ./Extras/tests_diff.bash smiteraux smiter-aux-results/smiter-aux
  artifacts:
    untracked: true
    paths:
      - smardda-lib/doc/srcdoc/html/

build-and-test-mpi-pfc:
  extends: .build-setup
  script:
    - apt-get -y install openmpi-bin libopenmpi-dev
    - python3 -m pip install "fieldcompare[all]" vtk
    - bash smardda-lib/exec/build gfortranmpi
    - bash exec/build gfortranmpi
    # Test
    - cd ./smiteraux # must be in smiteraux directory to run test deck
    - export OMPI_ALLOW_RUN_AS_ROOT=1
    - export OMPI_ALLOW_RUN_AS_ROOT_CONFIRM=1
    - bash ./test_mpi_EQX40-shado14r-resf14r-3g.bash
    - cd ..
    - tar -xf smiter-aux-results/smiteraux.tar.xz -C smiter-aux-results
    - |
      python3 ./tools/vtk_folder_compare.py \
        smiter-aux-results/smiter-aux/Test-EQX40-shado14r-resf14r-3g/P \
        smiteraux/Test-EQX40-shado14r-resf14r-3g_MPI/P


pages:
  stage: pages
  dependencies:
    - build-and-test-pfc
  script:
    # Move built docs to 'public' folder for GitLab pages
    - mkdir -p public
    - cp -a smardda-lib/doc/srcdoc/html/. public
  artifacts:
    paths:
    - public
  rules:
    - if: $CI_COMMIT_REF_NAME == $CI_DEFAULT_BRANCH
