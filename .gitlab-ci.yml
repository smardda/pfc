image: ubuntu:18.04

stages:
  - build
  - test

build-pfc-debug:
   variables:
     GIT_SUBMODULE_STRATEGY: recursive
   stage: build
   script:
     - apt-get -y update
     - apt-get -y install gfortran
     - apt-get -y install make
     - export SMALIB_DIR=$(pwd)/smardda-lib
     - cd smardda-lib
     - source ./exec/build gfortran_dbg N || true
     - cd ../
     - source ./exec/build gfortran_dbg N || true
   artifacts:
     paths:
       - smardda-lib/f95/libsmarddag.a    
