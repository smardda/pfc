image:
  name: ubuntu:20.04

stages:
  - build
  - test

build-pfc:
   variables:
     GIT_SUBMODULE_STRATEGY: recursive
   stage: build
   script:
     - apt-get -y update
     - export DEBIAN_FRONTEND=noninteractive  # stop interactive prompts
     - apt-get -y install git gfortran make qt5-default
     - strip --remove-section=.note.ABI-tag /usr/lib/x86_64-linux-gnu/libQt5Core.so.5
     - apt-get -y install gnuplot # gnuplot for .ps files
     - which gnuplot
     - gnuplot --version
     - git clean -dfx
     - git -C smardda-lib clean -dfx
     - git -C smiteraux clean -dfx
     - git -C smiter-aux-results clean -dfx
     - export SMALIB_DIR="$(pwd)/smardda-lib"
     - export SMITER_DIR="$(pwd)"
     - export SMALIB="$(pwd)/smardda-lib"
     - export SMALIB_DIR="$(pwd)/smardda-lib"
     - export PATH="${SMITER_DIR}/exec:${SMALIB_DIR}/exec:${PATH}"
     - bash smardda-lib/exec/build gfortran_dbg N
     - bash exec/build gfortran_dbg N
   artifacts:
     untracked: true
     paths:
       - smardda-lib/f95/
       - smardda-lib/fortd/
       - smardda-lib/exec/
       - exec/
   tags:
     - lower-privacy
     - ubuntu

run-test-deck-pfc-dbg:
   variables:
     GIT_SUBMODULE_STRATEGY: recursive
   stage: test
   dependencies:
     - build-pfc
   script:
     - apt-get -y update
     - export DEBIAN_FRONTEND=noninteractive  # stop interactive prompts
     - apt-get -y install gfortran xz-utils python3 python3-pip qt5-default
     - strip --remove-section=.note.ABI-tag /usr/lib/x86_64-linux-gnu/libQt5Core.so.5
     - apt-get -y install gnuplot # gnuplot for .ps files
     - python3 -m pip install numpy  # numpy for fast array comparisons with tolerance
     - export SMITER_DIR="$(pwd)"
     - export SMALIB="$(pwd)/smardda-lib"
     - export SMALIB_DIR="$(pwd)/smardda-lib"
     - export PATH="${SMITER_DIR}/exec:${SMALIB_DIR}/exec:${PATH}"
     - cd ./smiteraux  # must be in smiteraux directory to run test deck
     - bash ./tests.bash
     - cd ..
     - tar -xf smiter-aux-results/smiter-aux.tar.xz -C smiter-aux-results
     - bash ./Extras/tests_diff.bash smiteraux smiter-aux-results/smiter-aux
   tags:
     - lower-privacy
     - ubuntu
