image: ubuntu:18.04

stages:
  - build
  - test

build-pfc-debug:
   variables:
     GIT_SUBMODULE_STRATEGY: recursive
   stage: build
   script:
     - apt-get -y update
     - apt-get -y install gfortran
     - apt-get -y install make
     - export SMALIB_DIR=$(pwd)/smardda-lib
     - cd smardda-lib
     - cat exec/compile
     - cp ./config/config_gfortran_dbg.inc ./config/config.inc
     - cd ./fortd
     - ls
     - make -f makefile
     - cd ../f95
     - ln -sf ../fortd LIB
     - ls
     - for i in lib geofil move vtktfm datvtk hdsgen ctlgen parse; do make -j -f Makefile.lib $i ;done
     - for i in geofil move vtktfm datvtk hdsgen ctlgen parse; do mv -f $i ../exec ;done
     - cd ../../
     - source ./exec/build gfortran_dbg N
   artifacts:
     paths:
       - smardda-lib/f95/libsmarddag.a    
