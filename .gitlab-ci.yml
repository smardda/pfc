image: ubuntu:18.04

stages:
  - build
  - test

build-pfc:
   variables:
     GIT_SUBMODULE_STRATEGY: recursive
   stage: build
   script:
     - apt-get -y update
     - apt-get -y install gfortran
     - apt-get -y install make
     - export SMALIB_DIR=$(pwd)/smardda-lib
     - cd smardda-lib
     - chmod a+x ./exec/build
     - ./exec/build gfortran_dbg N
     - cd ../
     - chmod a+x ./exec/build
     - ./exec/build gfortran_dbg N
   artifacts:
     untracked: true
     paths:
       - smardda-lib/f95/
       - smardda-lib/fortd/
       - smardda-lib/exec/
       - exec/
run-test-deck-pfc-dbg:
   stage: test
   dependencies: 
     - build-pfc
   script: 
     - apt-get -y update
     - apt-get -y install gfortran
     - export SMITER_DIR=$(pwd)
     - export PATH=$SMITER_DIR/exec:$SMALIB_DIR/exec:$PATH
     - cd ./smiteraux
     - chmod a+x ./tests.bash
     - ./tests.bash
     - cd ..
     - cd ./smiter-aux-results
     - tar -xf smiter-aux.tar.xz  
     - tar -xf smiter-aux.tar
     - tar -Jxvf smiter-aux.tar.xz     
     - mv ./smiter-aux/ ../smiter-aux_old
     - cd ..
     - cd ./smiteraux
     - chmod a+x ./tests_diff.bash
     - ./tests_diff.bash