image: ubuntu:18.04

stages:
  - build
  - test

build-pfc:
   uses: actions/checkout@v2
   variables:
     GIT_SUBMODULE_STRATEGY: recursive
   stage: build
   script:
     - apt-get -y update
     - apt-get -y install gfortran
     - apt-get -y install make
     - export SMALIB_DIR=$(pwd)/smardda-lib
     - cd smardda-lib
     - chmod a+x ./exec/build
     - ./exec/build gfortran_dbg N
     - cd ../
     - chmod a+x ./exec/build
     - ./exec/build gfortran_dbg N
   uses: actions/upload-artifact@v2
   with:
     name: my-artifact
     path: 
       - exec/
       - smardda-lib/exec/
run-test-deck-pfc-dbg:
   uses: actions/checkout@v2
   stage: test
   script: 
     - export SMITER_DIR=$(pwd)
     - export PATH=$SMITER_DIR/exec:$SMALIB_DIR/exec:$PATH
     - cd ./smiteraux
     - chmod a+x ./tests.bash
     - ./tests.bash
   uses: actions/download-artifact@v2
   with:
     name: my-artifact